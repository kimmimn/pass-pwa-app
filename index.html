<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA 설치 테스트 (비밀번호 앱)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PWA 설치에 필요한 메타 정보 -->
    <meta name="theme-color" content="#4f46e5">
    
    <!-- Manifest 파일 연결 (PWA 필수) -->
    <link rel="manifest" href="./manifest.json">
    
    <style>
        /* 사용자 정의 CSS: 배경 및 폰트 설정 */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        /* PWA 설치 후 앱처럼 보이도록 스크롤을 방지합니다. */
        .app-container {
            min-height: 100vh;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center app-container">

    <div id="app" class="w-full max-w-sm p-6 bg-white rounded-xl shadow-2xl transition duration-500 ease-in-out transform hover:scale-[1.02] m-4">
        <div class="flex items-center space-x-3 mb-6 border-b pb-4">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-indigo-600">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <h1 class="text-3xl font-extrabold text-gray-900">내 비밀번호 PWA</h1>
        </div>

        <p class="text-sm text-gray-600 mb-6">
            **Service Worker 등록 시 scope를 명시적으로 설정**했습니다. "홈 화면에 추가"를 통해 설치를 진행해 보세요. **(만약 아이폰이라면 "홈 화면에 추가"가 유일한 설치 방법입니다.)**
        </p>

        <div class="space-y-4">
            <button onclick="generatePassword()" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold shadow-lg hover:bg-indigo-700 transition duration-300">
                비밀번호 생성
            </button>
            <div id="password-output" class="text-center p-3 border-2 border-dashed border-indigo-200 bg-indigo-50 rounded-lg text-lg font-mono text-indigo-800 break-all select-all">
                ********
            </div>
            <button onclick="copyPassword()" class="w-full bg-gray-200 text-gray-800 py-3 rounded-lg font-semibold hover:bg-gray-300 transition duration-300">
                클립보드에 복사
            </button>
        </div>
        
        <div class="mt-8 pt-4 border-t text-xs text-center text-gray-400">
            PWA Status: <span id="pwa-status" class="font-semibold text-red-500">Service Worker 준비 중...</span>
        </div>
    </div>

    <script>
        // PWA 설치에 필요한 핵심 로직
        function registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                // Service Worker 파일 (sw.js)을 상대 경로('./sw.js')로 등록하고 scope를 명시합니다.
                navigator.serviceWorker.register('./sw.js', { scope: './' })
                    .then(registration => {
                        console.log('Service Worker 등록 성공:', registration.scope);
                        document.getElementById('pwa-status').textContent = 'PWA 준비 완료 (설치 가능)';
                        document.getElementById('pwa-status').classList.remove('text-red-500');
                        document.getElementById('pwa-status').classList.add('text-green-600');
                    })
                    .catch(error => {
                        console.error('Service Worker 등록 실패:', error);
                        document.getElementById('pwa-status').textContent = 'PWA 등록 실패. 경로 확인 필요.';
                    });
            } else {
                console.warn('이 브라우저는 Service Worker를 지원하지 않습니다.');
                document.getElementById('pwa-status').textContent = 'SW 지원 안 됨';
            }
        }

        // 앱 기능 예시
        function generatePassword() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()';
            let password = '';
            for (let i = 0; i < 16; i++) {
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('password-output').textContent = password;
        }

        function copyPassword() {
            const output = document.getElementById('password-output');
            const textToCopy = output.textContent;

            // 클립보드 복사 (iFrame 환경 지원)
            const textarea = document.createElement('textarea');
            textarea.value = textToCopy;
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                alertMessage('비밀번호가 복사되었습니다!');
            } catch (err) {
                console.error('클립보드 복사 실패:', err);
                alertMessage('복사 실패. 텍스트를 직접 선택해 주세요.');
            }
            document.body.removeChild(textarea);
        }

        // alert() 대체 함수 (모달 메시지)
        function alertMessage(message) {
            const existingModal = document.getElementById('custom-modal');
            if (existingModal) existingModal.remove();

            const modal = document.createElement('div');
            modal.id = 'custom-modal';
            modal.className = 'fixed inset-0 bg-gray-600 bg-opacity-75 flex items-center justify-center z-50 transition-opacity duration-300';
            modal.innerHTML = `
                <div class="bg-white p-6 rounded-xl shadow-2xl max-w-xs w-full">
                    <p class="text-gray-800 font-semibold text-center mb-4">${message}</p>
                    <button id="modal-close" class="w-full bg-indigo-500 text-white py-2 rounded-lg hover:bg-indigo-600 transition duration-300">확인</button>
                </div>
            `;
            document.body.appendChild(modal);

            document.getElementById('modal-close').onclick = () => {
                modal.classList.add('opacity-0');
                setTimeout(() => modal.remove(), 300);
            };
        }

        // 앱 로드 시 Service Worker 등록을 시도합니다.
        window.onload = registerServiceWorker;
    </script>
</body>
</html>
